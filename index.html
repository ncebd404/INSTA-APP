<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Creator Tool</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600&display=swap');
        
        body { 
            font-family: 'Roboto Mono', monospace; 
            background: #0a0c0b;
            margin: 0;
            padding: 0;
            color: #00d4a5;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(212, 175, 55, 0.018) 50%, transparent 100%),
                        linear-gradient(0deg, transparent 0%, rgba(0, 212, 165, 0.012) 50%, transparent 100%);
            animation: subtleScan 7s linear infinite;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes subtleScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .container { 
            background: rgba(12, 15, 14, 0.98);
            border: 1px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.18),
                        inset 0 0 25px rgba(0, 212, 165, 0.06);
            width: 100%; 
            max-width: 400px; 
            height: 100vh;
            margin: 0 auto;
            padding: 22px 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 1.32rem;
            margin: 0 0 26px 0;
            text-align: center;
            color: #f4e8c1;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.35);
            padding-bottom: 12px;
            font-weight: 500;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        input, .data-box {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            margin-bottom: 17px;
            border: 1px solid #00d4a5;
            background: rgba(15, 20, 18, 0.88);
            color: #e0f7ef;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.97rem;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.25s ease;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.45);
        }
        
        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.25),
                        inset 0 3px 10px rgba(0, 0, 0, 0.5);
            outline: none;
        }

        .data-box {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding-left: 18px;
            border-left: 5px solid #d4af37;
            background: rgba(14, 18, 16, 0.92);
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
        }
        .data-box:hover {
            background: rgba(20, 26, 23, 0.95);
            box-shadow: 0 6px 18px rgba(212, 175, 55, 0.22);
            transform: translateY(-1px);
            border-left-color: #f4e8c1;
        }
        input::placeholder {
            color: #006b52;
        }

        .action-buttons {
            display: flex;
            gap: 14px;
            margin-bottom: 18px;
        }
        .action-buttons button {
            flex: 1;
            height: 48px;
            font-size: 0.93rem;
            font-weight: 500;
            border: 1px solid #d4af37;
            background: transparent;
            color: #d4af37;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            letter-spacing: 0.8px;
        }
        .action-buttons button:hover {
            background: linear-gradient(135deg, #d4af37, #f4e8c1);
            color: #0a0c0b;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
            transform: translateY(-2px);
        }
        .action-buttons #clearBtn {
            border-color: #c94d4d;
            color: #ff9999;
        }
        .action-buttons #clearBtn:hover {
            background: linear-gradient(135deg, #c94d4d, #ff7777);
            color: #fff;
            box-shadow: 0 6px 20px rgba(201, 77, 77, 0.4);
        }

        .save-box {
            flex: 1;
            padding: 16px;
            background: rgba(10, 14, 12, 0.94);
            border: 1px solid #00d4a5;
            border-radius: 8px;
            overflow-y: auto;
            font-size: 0.9rem;
            white-space: pre;
            position: relative;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
        }
        .save-box .counter {
            position: absolute;
            top: 12px;
            right: 14px;
            background: linear-gradient(135deg, #d4af37, #f4e8c1);
            color: #0a0c0b;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.35);
        }

        .message {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            background: rgba(12, 16, 14, 0.96);
            border-left: 5px solid #d4af37;
            color: #f4e8c1;
            border-radius: 8px;
            font-size: 0.93rem;
            z-index: 1000;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            animation: toastIn 0.45s ease;
        }
        .message.success { border-left-color: #00d4a5; color: #e0f7ef; }
        .message.error { border-left-color: #c94d4d; color: #ff9999; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #d4af37;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Instagram Creator Tool</h1>

        <input type="text" id="passwordInput" 
               placeholder="Enter Password" 
               value="nirob@20"
               onclick="copyPassword()">

        <div class="data-box" id="nameBox" onclick="generateName()">
            Click for Random BD Name
        </div>

        <div class="data-box" id="usernameBox" onclick="generateUsername()">
            Click for Username
        </div>

        <input type="text" id="secretKey" placeholder="Enter 2FA Secret Key">

        <div class="data-box" id="tokenBox">
            2FA Code will appear here
        </div>

        <div class="action-buttons">
            <button onclick="copyAll()">Copy All</button>
            <button id="clearBtn" onclick="confirmClearAll()">Clear All</button>
        </div>

        <div class="save-box" id="saveBox">
            <div id="saveData">Output will be saved here\n(username\tpassword\t2fa_key)</div>
            <span class="counter" id="dataCounter">0</span>
        </div>
    </div>

    <div class="message" id="messageBox"></div>

    <script>
        // ==================== BANGLADESHI NAMES ====================
        const bangladeshiNames = [
            "Nirob Ahmed","Rahim Khan","Karim Hossain","Abdullah Rahman","Mohammad Islam",
            "Hasan Ali","Md Rakib Chowdhury","Faisal Ahmed","Siam Khan","Tanvir Hossain",
            "Arif Rahman","Shakil Islam","Imran Ali","Sabbir Ahmed","Rifat Khan",

            "Nazmul Hossain","Shuvo Rahman","Alamgir Khan","Farhan Islam","Saif Ali",

            "Shanto Islam","Badhon Ali","Rayhan Ahmed","Niloy Khan","Arnob Hossain",
            "Tahmina Akter","Nusrat Jahan","Sharmin Sultana","Farzana Islam","Rokeya Khatun",
            "Nasrin Begum","Jesmin Ara","Salma Akhter","Mousumi Rahman","Shila Khan",
            "Shamim Ahmed","Jannatul Ferdous","Sumaiya Islam","Tasnim Hossain","Maria Sultana",
            "Anika Rahman","Runa Laila","Shathi Chowdhury","Rokhsana Begum","Tania Akter",
            "Sadman Sakib","Mehedi Hasan","Tanvir Anjum","Shahidul Islam","Nahid Hossain",
            "Rubel Ahmed","Sohel Rana","Masud Rana","Kamrul Hasan","Rasel Khan",
            "Rakib Hasan","Shahadat Hossain","Shakib Al Hasan","Mushfiqur Rahim","Tamim Iqbal",
            "Liton Das","Mustafizur Rahman","Taskin Ahmed","Soumya Sarkar","Mahmudullah Riyad",
            "Nahida Akter","Jahanara Alam","Salma Khatun","Rumana Ahmed","Lata Mondol",
            "Puja Chakraborty","Trina Saha","Shila Ahmed","Mim Akter","Toma Khatun",
            "Rashedul Islam","Jahangir Alam","Mosharraf Hossain","Enamul Haque","Shamim Reza",
            "Farhad Hossain","Khaled Mahmud","Moniruzzaman Moni","Alauddin Ali","Shahid Uddin",
            "Fazlur Rahman","Aminul Islam","Abul Kalam Azad","Nurul Islam","Ziaul Haque",
            "Rezaul Karim","Selim Reza","Maksudul Hasan","Hanif Sheikh","Sirajul Islam",
            "Fatema Khatun","Kulsum Akter","Shahnaz Begum","Parveen Sultana","Lovely Yasmin",
            "Beauty Akhter","Tania Sultana","Sabina Yesmin","Aruna Biswas","Nipa Chakraborty",
            "Rima Saha","Moumita Dey","Debjani Roy","Soma Rani","Protima Das",
            "Shampa Ghosh","Keya Banerjee","Bithi Das","Lipika Paul","Tuli Mondol",
            "Kabir Hossain","Masum Khan","Omar Faruk","Mamunur Rashid","Ismail Hossain",
            "Abu Sayeed","Talha Jubayer","Arman Hossain","Nobel Islam","Rafi Ahmed",
            "Saad Rahman","Zayed Khan","Tahmid Islam","Arafat Hossain","Murad Khan",
            "Samia Afrin","Farhana Yesmin","Nadia Sultana","Tahmina Sarker","Roksana Akter",
            "Afroza Begum","Morsheda Khatun","Sultana Razia","Ayesha Akter","Shirin Sultana",
            "Laila Khan","Sabnam Hossain","Toma Begum","Ridita Rahman","Samira Akhter",
            "Jannat Ara","Faria Sultana","Rafa Yasmin","Orchi Chowdhury","Tithi Rani",
            "Priti Das","Shraboni Akter","Ishita Saha","Tisha Roy","Sneha Hossain",
            "Adnan Chowdhury","Rakin Khan","Safayet Hossain","Turjo Islam","Sohan Ahmed",
            "Mahir Rahman","Rudra Das","Dipu Mondol","Koushik Paul","Sudipto Sarker"
        ];

        let currentFullName = '';
        let currentFirstName = '';
        let currentUsername = '';
        const tokenCache = new Map();

        const API_ENDPOINTS = [
            'https://2fa.live/tok/',
            'https://api.2fa.live/tok/',
            'https://2fa.live/api/totp/'
        ];
        
        const CORS_PROXIES = [
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url='
        ];

        let currentRequestController = null;

        function debounce(func, wait) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        async function copyToClipboard(text, customMsg = "Copied!") {
            try {
                await navigator.clipboard.writeText(text);
                showMessage(customMsg, "success");
            } catch (e) {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showMessage(customMsg, "success");
            }
        }

        function showMessage(text, type = "success") {
            const msg = document.getElementById('messageBox');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => { 
                msg.textContent = ''; 
                msg.className = 'message'; 
            }, 2600);
        }

        function copyPassword() {
            const password = document.getElementById('passwordInput').value.trim();
            if (password) copyToClipboard(password, "Password Copied!");
            else showMessage("No password entered!", "error");
        }

        function copyAll() {
            const data = document.getElementById('saveData').textContent.trim();
            if (data && !data.includes('Output will be saved here')) {
                copyToClipboard(data, "All data copied!");
            } else {
                showMessage("No data to copy", "error");
            }
        }

        function confirmClearAll() {
            if (confirm("Are you sure you want to delete ALL saved data?")) {
                clearAll();
            }
        }

        function clearAll() {
            document.getElementById('saveData').textContent = 'Output will be saved here\n(username\tpassword\t2fa_key)';
            document.getElementById('dataCounter').textContent = '0';
            document.getElementById('nameBox').textContent = 'Click for Random BD Name';
            document.getElementById('usernameBox').textContent = 'Click for Username';
            document.getElementById('tokenBox').textContent = '2FA Code will appear here';
            document.getElementById('secretKey').value = '';
            currentFullName = currentFirstName = currentUsername = '';
            tokenCache.clear();
            localStorage.removeItem('savedData');
            showMessage("All data cleared!", "success");
        }

        function extractFirstName(fullName) {
            return fullName.trim().split(/\s+/)[0].toLowerCase();
        }

        function buildUsername(firstName) {
            const randomDigits = Math.floor(1000 + Math.random() * 9000);
            return `${firstName}_x_${randomDigits}`;
        }

        function generateName() {
            const idx = Math.floor(Math.random() * bangladeshiNames.length);
            currentFullName = bangladeshiNames[idx];
            currentFirstName = extractFirstName(currentFullName);
            document.getElementById('nameBox').textContent = currentFullName;
            document.getElementById('usernameBox').textContent = 'Click for Username';
            currentUsername = '';
            copyToClipboard(currentFullName, "Name copied!");
        }

        function generateUsername() {
            let firstNameToUse = currentFirstName || extractFirstName(bangladeshiNames[Math.floor(Math.random() * bangladeshiNames.length)]);
            currentUsername = buildUsername(firstNameToUse);
            document.getElementById('usernameBox').textContent = currentUsername;
            copyToClipboard(currentUsername, "Username copied!");
        }

        async function fetchWithTimeout(url, timeout = 5000) {
            const controller = new AbortController();
            setTimeout(() => controller.abort(), timeout);
            const response = await fetch(url, { signal: controller.signal });
            return response;
        }

        async function tryFetchToken(secretKey) {
            if (tokenCache.has(secretKey)) {
                const cached = tokenCache.get(secretKey);
                if (Date.now() - cached.timestamp < 28000) return cached.token;
                else tokenCache.delete(secretKey);
            }

            for (const proxy of CORS_PROXIES) {
                for (const endpoint of API_ENDPOINTS) {
                    try {
                        const url = `${proxy}${endpoint}${secretKey}`;
                        const response = await fetchWithTimeout(url, 4000);
                        
                        if (response.ok) {
                            const data = await response.json();
                            const token = data.token || data.otp || data.code || data.totp;
                            
                            if (token && /^\d{6}$/.test(token)) {
                                tokenCache.set(secretKey, { token, timestamp: Date.now() });
                                return token;
                            }
                        }
                    } catch (err) {
                        continue;
                    }
                }
            }
            throw new Error("All 2FA providers failed");
        }

        function setLoading(isLoading) {
            const tokenBox = document.getElementById('tokenBox');
            if (isLoading) {
                tokenBox.innerHTML = '<span class="loading-spinner"></span> Generating 2FA...';
            } else {
                if (tokenBox.innerHTML.includes('Generating')) {
                    tokenBox.textContent = '2FA Code will appear here';
                }
            }
        }

        async function generate2FA(key) {
            const password = document.getElementById('passwordInput').value.trim();
            const tokenBox = document.getElementById('tokenBox');
            const saveDataEl = document.getElementById('saveData');

            if (!password) return showMessage("Enter password first!", "error");
            if (!currentUsername) return showMessage("Generate username first!", "error");

            const cleanedKey = key.trim().replace(/\s/g, '').toUpperCase();
            if (!cleanedKey) return;

            setLoading(true);

            try {
                const token = await tryFetchToken(cleanedKey);
                
                tokenBox.textContent = token;
                await copyToClipboard(token, `2FA Code: ${token}`);

                const line = `${currentUsername}\t${password}\t${cleanedKey}`;
                let content = saveDataEl.textContent.includes('Output will be saved here') ? '' : saveDataEl.textContent.trim() + '\n';
                content += line;
                saveDataEl.textContent = content;

                const count = content.split('\n').filter(l => l.trim() && !l.includes('Output will be saved here')).length;
                document.getElementById('dataCounter').textContent = count;
                localStorage.setItem('savedData', content);

                // Reset fields
                document.getElementById('secretKey').value = '';
                document.getElementById('nameBox').textContent = 'Click for Random BD Name';
                document.getElementById('usernameBox').textContent = 'Click for Username';
                document.getElementById('tokenBox').textContent = '2FA Code will appear here';

                currentFullName = currentFirstName = currentUsername = '';

                showMessage(`✅ 2FA: ${token} (Saved)`, "success");

            } catch (err) {
                console.error(err);
                tokenBox.textContent = 'Failed! Try again';
                showMessage("Failed to generate 2FA code", "error");
                setTimeout(() => {
                    if (tokenBox.textContent === 'Failed! Try again') {
                        tokenBox.textContent = '2FA Code will appear here';
                    }
                }, 2000);
            } finally {
                setLoading(false);
            }
        }

        const debounced2FA = debounce(generate2FA, 300);
        document.getElementById('secretKey').addEventListener('input', e => {
            const val = e.target.value.trim();
            if (val.length >= 10) debounced2FA(val);
        });

        window.onload = () => {
            const saved = localStorage.getItem('savedData');
            if (saved) {
                document.getElementById('saveData').textContent = saved;
                const lines = saved.split('\n').filter(l => l.trim() && !l.includes('Output will be saved here'));
                document.getElementById('dataCounter').textContent = lines.length;
            }
        };
    </script>
</body>
</html>
